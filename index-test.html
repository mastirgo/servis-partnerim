
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Servis Partnerim</title>
<style>
:root{--navy:#123b63;--blue:#1769aa;--bg:#f3f6fa;--ink:#243447}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font-family:Arial,sans-serif;color:var(--ink)}
header{background:var(--navy);color:white;padding:20px;text-align:center}
main{max-width:760px;margin:24px auto;padding:0 14px}
.card{background:white;border-radius:14px;padding:20px;margin-bottom:16px;box-shadow:0 3px 14px #0000000d}
h2{color:var(--navy);margin-top:0}
input,select,button{width:100%;padding:12px;margin:7px 0;border:1px solid #ccd5df;border-radius:8px;font-size:15px}
button{background:var(--blue);color:white;border:0;font-weight:bold;cursor:pointer}
button:disabled{opacity:.6}
button.secondary{background:#64748b}
small{color:#64748b}
.hidden{display:none}
.msg{padding:12px;border-radius:8px;background:#e8f3ff;margin:10px 0;white-space:pre-wrap;overflow-wrap:anywhere}
.item{padding:12px;border:1px solid #dce3eb;border-radius:8px;margin:8px 0}
.row{display:flex;gap:10px}
.row>*{flex:1;min-width:0}
</style>
</head>
<body>
<header>
<h1>Servis Partnerim</h1>
<p>Okul ve personel servis yönetimi</p>
</header>

<main>
<section id="auth">
<div class="card">
<h2>Giriş Yap</h2>
<input id="email" type="email" placeholder="E-posta adresi">
<input id="password" type="password" placeholder="Şifre">
<button onclick="login()">Giriş Yap</button>
<div id="authMsg" class="msg hidden"></div>
</div>

<div class="card">
<h2>Yeni Hesap Oluştur</h2>
<input id="regName" placeholder="Ad Soyad / Firma adı">
<input id="regPhone" placeholder="Telefon">
<input id="regEmail" type="email" placeholder="E-posta">
<input id="regPassword" type="password" placeholder="Şifre (en az 6 karakter)">
<select id="regRole">
<option value="company">Firma</option>
<option value="driver">Şoför</option>
<option value="passenger">Yolcu / Veli / Personel</option>
</select>
<button id="signupBtn" onclick="signup()">Hesap Oluştur</button>
<div id="regMsg" class="msg hidden"></div>
<small>Hesap oluşturduktan sonra e-posta doğrulaması istenebilir.</small>
</div>
</section>

<section id="onboarding" class="hidden">
<div class="card">
<h2 id="setupTitle">Hesap Kurulumu</h2>
<div id="setupFields"></div>
<div id="setupMsg" class="msg hidden"></div>
</div>
</section>

<section id="panel" class="hidden">
<div class="card">
<div class="row">
<div><h2 id="welcome">Panel</h2></div>
<div><button class="secondary" onclick="logout()">Çıkış</button></div>
</div>
<div id="profileInfo"></div>
</div>

<div id="companyPanel" class="hidden">
<div class="card">
<h2>Firma Bilgileri</h2>
<div id="companyInfo"></div>
</div>
<div class="card">
<h2>Güzergâh Oluştur</h2>
<input id="routeName" placeholder="Güzergâh adı">
<select id="routeType">
<option>Personel Servisi</option>
<option>Okul Servisi</option>
</select>
<input id="startPoint" placeholder="Başlangıç noktası">
<input id="endPoint" placeholder="Bitiş noktası">
<input id="plannedKm" type="number" step="0.1" placeholder="Planlanan kilometre">
<button onclick="addRoute()">Güzergâh Ekle</button>
<div id="routeMsg" class="msg hidden"></div>
</div>
<div class="card">
<h2>Güzergâhlarım</h2>
<div id="companyRoutes"></div>
</div>
</div>

<div id="memberPanel" class="hidden">
<div class="card">
<h2>Servis Bilgilerim</h2>
<div id="memberInfo"></div>
</div>
<div class="card">
<h2>Servis Kullanım Tercihim</h2>
<label><input style="width:auto" type="checkbox" id="morning"> Sabah servisini kullanıyorum</label>
<label><input style="width:auto" type="checkbox" id="evening"> Akşam servisini kullanıyorum</label>
<button onclick="saveRideStatus()">Tercihlerimi Kaydet</button>
<div id="rideMsg" class="msg hidden"></div>
</div>
</div>
</section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* SUPABASE AYARLARI */
const SUPABASE_URL = "https://xfwgzpoeclfyrizmtxiz.supabase.co";
const SUPABASE_KEY ="sb_publishable_JvhgtssPUHcLzeOIs3GCkA_JWu6v3Ra";

let db = null;
let currentUser = null;
let currentProfile = null;

function showMsg(id,text){
  const el=document.getElementById(id);
  el.textContent=text;
  el.classList.remove("hidden");
}
function hide(id){document.getElementById(id).classList.add("hidden")}
function show(id){document.getElementById(id).classList.remove("hidden")}
function val(id){return document.getElementById(id).value.trim()}
function roleName(role){
  return ({company:"Firma",driver:"Şoför",passenger:"Yolcu"})[role] || role;
}
function showOnly(section){
  ["auth","onboarding","panel"].forEach(id=>hide(id));
  show(section);
}

function initSupabase(){
  if(typeof supabase==="undefined"){
    showMsg("authMsg","Supabase kütüphanesi yüklenemedi. İnternet bağlantısını kontrol edin.");
    return false;
  }
  if(!SUPABASE_KEY.startsWith("sb_publishable_")){
    showMsg("authMsg","Supabase anahtarı henüz girilmemiş veya hatalı. Kodda SUPABASE_KEY satırını kontrol edin.");
    return false;
  }
  db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
  return true;
}

async function signup(){
  hide("regMsg");
  if(!db){showMsg("regMsg","Supabase bağlantısı hazır değil. Sayfayı yenileyin.");return}

  const btn=document.getElementById("signupBtn");
  const name=val("regName"),phone=val("regPhone"),
        email=val("regEmail"),password=val("regPassword"),
        role=val("regRole");

  if(!name||!email||!password){
    showMsg("regMsg","Ad, e-posta ve şifre alanlarını doldurun.");
    return;
  }
  if(password.length<6){
    showMsg("regMsg","Şifre en az 6 karakter olmalıdır.");
    return;
  }

  btn.disabled=true;
  btn.textContent="Hesap oluşturuluyor...";

  try{
    const {data,error}=await db.auth.signUp({
      email,password,
      options:{
        data:{full_name:name,phone,role},
        emailRedirectTo:"https://mastirgo.github.io/servis-partnerim/index-test.html"
      }
    });

    if(error) throw error;

    showMsg("regMsg",
      "Hesap oluşturma isteği gönderildi.\n"+
      "E-posta doğrulaması isteniyorsa gelen kutunuzu kontrol edin.\n"+
      "Doğrulama tamamlandıktan sonra giriş yapın."
    );
  }catch(error){
    showMsg("regMsg","Kayıt hatası: "+(error.message||String(error)));
  }finally{
    btn.disabled=false;
    btn.textContent="Hesap Oluştur";
  }
}

async function login(){
  hide("authMsg");
  if(!db){showMsg("authMsg","Supabase bağlantısı hazır değil.");return}

  const email=val("email"),password=val("password");
  if(!email||!password){showMsg("authMsg","E-posta ve şifre girin.");return}

  try{
    const {data,error}=await db.auth.signInWithPassword({email,password});
    if(error) throw error;
    currentUser=data.user;
    await loadProfile();
  }catch(error){
    showMsg("authMsg","Giriş hatası: "+(error.message||String(error)));
  }
}

async function loadProfile(){
  const {data,error}=await db.from("profiles")
    .select("*").eq("id",currentUser.id).maybeSingle();

  if(error){
    showOnly("auth");
    showMsg("authMsg","Profil okunamadı: "+error.message);
    return;
  }

  if(!data){
    const role=currentUser.user_metadata?.role;
    if(!["company","driver","passenger"].includes(role)){
      showOnly("auth");
      showMsg("authMsg","Hesap rolü bulunamadı.");
      return;
    }
    showSetup(role);
    return;
  }

  currentProfile=data;
  await showPanel();
}

function showSetup(role){
  showOnly("onboarding");
  document.getElementById("setupTitle").textContent=roleName(role)+" Hesap Kurulumu";

  if(role==="company"){
    document.getElementById("setupFields").innerHTML=`
      <p>Firma hesabınızı oluşturun.</p>
      <button onclick="createCompany()">Firmamı Oluştur</button>`;
  }else{
    document.getElementById("setupFields").innerHTML=`
      <p>Katılmak istediğiniz firmanın kodunu ve güzergâhınızı girin.</p>
      <input id="joinCode" placeholder="Firma katılım kodu">
      <button onclick="findRoutes()">Güzergâhları Getir</button>
      <select id="joinRoute"><option value="">Önce firma kodunu girin</option></select>
      <button onclick="joinCompany()">Firmaya Katıl</button>`;
  }
}

async function createCompany(){
  try{
    const {error}=await db.rpc("create_company",{
      p_company_name:currentUser.user_metadata.full_name,
      p_full_name:currentUser.user_metadata.full_name,
      p_phone:currentUser.user_metadata.phone || null
    });
    if(error) throw error;
    showMsg("setupMsg","Firma oluşturuldu. Profil bilgileri yükleniyor...");
    await loadProfile();
  }catch(error){
    showMsg("setupMsg","Firma oluşturulamadı: "+error.message);
  }
}

async function findRoutes(){
  const code=val("joinCode");
  if(!code){showMsg("setupMsg","Firma kodunu girin.");return}

  try{
    const {data,error}=await db.rpc("get_company_routes",{p_join_code:code});
    if(error) throw error;

    const select=document.getElementById("joinRoute");
    select.innerHTML='<option value="">Güzergâh seçin</option>';

    (data||[]).forEach(route=>{
      const option=document.createElement("option");
      option.value=route.route_id;
      option.textContent=route.route_name;
      select.appendChild(option);
    });

    if(!data||!data.length)showMsg("setupMsg","Bu firmaya ait güzergâh bulunamadı.");
    else showMsg("setupMsg",data.length+" güzergâh bulundu.");
  }catch(error){
    showMsg("setupMsg","Güzergâhlar alınamadı: "+error.message);
  }
}

async function joinCompany(){
  const code=val("joinCode");
  const routeId=val("joinRoute");
  if(!code||!routeId){showMsg("setupMsg","Firma kodu ve güzergâh seçimi gereklidir.");return}

  try{
    const meta=currentUser.user_metadata||{};
    const {error}=await db.rpc("join_company",{
      p_join_code:code,
      p_role:meta.role,
      p_route_id:routeId,
      p_full_name:meta.full_name || currentUser.email,
      p_phone:meta.phone || null,
      p_morning_enabled:true,
      p_evening_enabled:true
    });
    if(error) throw error;
    showMsg("setupMsg","Katılım tamamlandı. Profil yükleniyor...");
    await loadProfile();
  }catch(error){
    showMsg("setupMsg","Katılım başarısız: "+error.message);
  }
}

async function showPanel(){
  showOnly("panel");
  hide("companyPanel");
  hide("memberPanel");

  const p=currentProfile;
  document.getElementById("welcome").textContent="Merhaba, "+(p.full_name||"Kullanıcı");
  document.getElementById("profileInfo").textContent="Hesap türü: "+roleName(p.role);

  if(p.role==="company"){
    show("companyPanel");
    await loadCompany();
  }else{
    show("memberPanel");
    await loadMember();
  }
}

async function loadCompany(){
  const {data:company,error}=await db.from("companies")
    .select("*").eq("id",currentProfile.company_id).maybeSingle();

  if(error){
    document.getElementById("companyInfo").textContent="Firma bilgisi okunamadı: "+error.message;
  }else if(company){
    document.getElementById("companyInfo").textContent=
      "Firma: "+(company.name||"")+
      " | Firma kodu: "+(company.join_code||"Henüz görüntülenemiyor");
  }

  const {data:routes,error:routeError}=await db.from("routes")
    .select("id,name,route_type")
    .eq("company_id",currentProfile.company_id);

  const box=document.getElementById("companyRoutes");
  box.innerHTML="";
  if(routeError){box.textContent="Güzergâhlar okunamadı: "+routeError.message;return}
  if(!routes||!routes.length){box.textContent="Henüz güzergâh eklenmedi.";return}

  routes.forEach(r=>{
    const div=document.createElement("div");
    div.className="item";
    div.textContent=(r.name||"İsimsiz güzergâh")+" — "+(r.route_type||"");
    box.appendChild(div);
  });
}

async function addRoute(){
  const name=val("routeName");
  if(!name){showMsg("routeMsg","Güzergâh adı girin.");return}

  const {error}=await db.from("routes").insert({
    company_id:currentProfile.company_id,
    name,
    route_type:val("routeType"),
    start_point:val("startPoint")||null,
    end_point:val("endPoint")||null,
    planned_km:val("plannedKm")?Number(val("plannedKm")):null
  });

  if(error){showMsg("routeMsg","Güzergâh eklenemedi: "+error.message);return}

  showMsg("routeMsg","Güzergâh eklendi.");
  ["routeName","startPoint","endPoint","plannedKm"].forEach(id=>document.getElementById(id).value="");
  await loadCompany();
}

async function loadMember(){
  const p=currentProfile;
  document.getElementById("memberInfo").textContent=
    "Ad Soyad: "+(p.full_name||"")+
    " | Rol: "+roleName(p.role)+
    " | Sabah: "+(p.morning_enabled?"Evet":"Hayır")+
    " | Akşam: "+(p.evening_enabled?"Evet":"Hayır");

  document.getElementById("morning").checked=!!p.morning_enabled;
  document.getElementById("evening").checked=!!p.evening_enabled;
}

async function saveRideStatus(){
  try{
    const {error}=await db.rpc("update_my_ride_status",{
      p_morning:document.getElementById("morning").checked,
      p_evening:document.getElementById("evening").checked
    });
    if(error) throw error;
    showMsg("rideMsg","Servis tercihleriniz kaydedildi.");
    await loadProfile();
  }catch(error){
    showMsg("rideMsg","Tercihler kaydedilemedi: "+error.message);
  }
}

async function logout(){
  await db.auth.signOut();
  currentUser=null;
  currentProfile=null;
  showOnly("auth");
}

async function start(){
  if(!initSupabase())return;
  try{
    const {data,error}=await db.auth.getSession();
    if(error) throw error;
    if(data.session){
      currentUser=data.session.user;
      await loadProfile();
    }
  }catch(error){
    showMsg("authMsg","Başlatma hatası: "+error.message);
  }
}
start();
</script>
</body>
</html>
