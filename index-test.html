
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#123b63">
<title>Servis Partnerim</title>
<style>
:root{--navy:#123b63;--blue:#1769aa;--bg:#f3f6fa;--ink:#243447}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font-family:Arial,sans-serif;color:var(--ink)}
header{background:var(--navy);color:white;padding:20px;text-align:center}
main{max-width:760px;margin:24px auto;padding:0 14px}
.card{background:white;border-radius:14px;padding:20px;margin-bottom:16px;box-shadow:0 3px 14px #0000000d}
h2{color:var(--navy);margin-top:0}
input,select,button{width:100%;padding:12px;margin:7px 0;border:1px solid #ccd5df;border-radius:8px;font-size:15px}
button{background:var(--blue);color:white;border:0;font-weight:bold;cursor:pointer}
button:disabled{opacity:.6}
button.secondary{background:#64748b}
small{color:#64748b}
.hidden{display:none!important}
.msg{padding:12px;border-radius:8px;background:#e8f3ff;margin:10px 0;white-space:pre-wrap;overflow-wrap:anywhere}
.item{padding:12px;border:1px solid #dce3eb;border-radius:8px;margin:8px 0}
.row{display:flex;gap:10px;align-items:center}
.row>*{flex:1;min-width:0}
label{display:block;margin:12px 0}
</style>
</head>
<body>

<header>
<h1>Servis Partnerim</h1>
<p>Okul ve personel servis yönetimi</p>
</header>

<main>

<section id="auth">
<div class="card">
<h2>Giriş Yap</h2>
<input id="email" type="email" placeholder="E-posta adresi">
<input id="password" type="password" placeholder="Şifre">
<button id="loginBtn" onclick="login()">Giriş Yap</button>
<div id="authMsg" class="msg hidden"></div>
</div>

<div class="card">
<h2>Yeni Hesap Oluştur</h2>
<input id="regName" placeholder="Ad Soyad / Firma adı">
<input id="regPhone" placeholder="Telefon">
<input id="regEmail" type="email" placeholder="E-posta">
<input id="regPassword" type="password" placeholder="Şifre (en az 6 karakter)">
<select id="regRole">
<option value="company">Firma</option>
<option value="driver">Şoför</option>
<option value="passenger">Yolcu / Veli / Personel</option>
</select>
<button id="signupBtn" onclick="signup()">Hesap Oluştur</button>
<div id="regMsg" class="msg hidden"></div>
<small>Hesap oluşturduktan sonra e-posta doğrulaması istenebilir.</small>
</div>
</section>

<section id="onboarding" class="hidden">
<div class="card">
<div class="row">
<h2 id="setupTitle">Hesap Kurulumu</h2>
<button class="secondary" onclick="logout()">Çıkış</button>
</div>
<div id="setupFields"></div>
<div id="setupMsg" class="msg hidden"></div>
</div>
</section>

<section id="panel" class="hidden">
<div class="card">
<div class="row">
<div><h2 id="welcome">Panel</h2></div>
<div><button class="secondary" onclick="logout()">Çıkış</button></div>
</div>
<div id="profileInfo"></div>
</div>

<div id="companyPanel" class="hidden">
<div class="card">
<h2>Firma Bilgileri</h2>
<div id="companyInfo"></div>
</div>

<div class="card">
<h2>Güzergâh Oluştur</h2>
<input id="routeName" placeholder="Güzergâh adı">
<select id="routeType">
<option>Personel Servisi</option>
<option>Okul Servisi</option>
</select>
<input id="startPoint" placeholder="Başlangıç noktası">
<input id="endPoint" placeholder="Bitiş noktası">
<input id="plannedKm" type="number" step="0.1" placeholder="Planlanan kilometre">
<button onclick="addRoute()">Güzergâh Ekle</button>
<div id="routeMsg" class="msg hidden"></div>
</div>

<div class="card">
<h2>Güzergâhlarım</h2>
<div id="companyRoutes"></div>
</div>
</div>

<div id="memberPanel" class="hidden">
<div class="card">
<h2>Servis Bilgilerim</h2>
<div id="memberInfo"></div>
</div>

<div class="card hidden" id="ridePreferenceCard">
<h2>Servis Kullanım Tercihim</h2>
<label>
<input style="width:auto" type="checkbox" id="morning">
Sabah servisini kullanıyorum
</label>
<label>
<input style="width:auto" type="checkbox" id="evening">
Akşam servisini kullanıyorum
</label>
<button onclick="saveRideStatus()">Tercihlerimi Kaydet</button>
<div id="rideMsg" class="msg hidden"></div>
</div>
</div>
</section>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL="https://xfwgzpoeclfyrizmtxiz.supabase.co";
const SUPABASE_KEY="sb_publishable_JvhgtssPUHcLzeOIs3GCkA_JWu6v3Ra";

let db=null;
let currentUser=null;
let currentProfile=null;

function showMsg(id,text){
  const el=document.getElementById(id);
  if(!el)return;
  el.textContent=text;
  el.classList.remove("hidden");
}
function hide(id){
  const el=document.getElementById(id);
  if(el)el.classList.add("hidden");
}
function show(id){
  const el=document.getElementById(id);
  if(el)el.classList.remove("hidden");
}
function val(id){
  return document.getElementById(id).value.trim();
}
function roleName(role){
  return ({company:"Firma",driver:"Şoför",passenger:"Yolcu"})[role]||role;
}
function showOnly(section){
  ["auth","onboarding","panel"].forEach(hide);
  show(section);
}

function initSupabase(){
  if(typeof supabase==="undefined"){
    showMsg("authMsg","Supabase kütüphanesi yüklenemedi. İnternet bağlantısını kontrol edin.");
    return false;
  }

  db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{
    auth:{
      persistSession:true,
      autoRefreshToken:true,
      detectSessionInUrl:true
    }
  });
  return true;
}

// Oturumu yerel cihazdan temizle
async function logout(){
  try{
    if(db){
      await db.auth.signOut({scope:"local"});
    }
  }catch(e){
    console.error("Çıkış hatası:",e);
  }

  currentUser=null;
  currentProfile=null;

  showOnly("auth");
  showMsg("authMsg","Oturum kapatıldı. Lütfen e-posta ve şifrenizle yeniden giriş yapın.");
  document.getElementById("password").value="";
}

async function signup(){
  hide("regMsg");

  const btn=document.getElementById("signupBtn");
  const name=val("regName");
  const phone=val("regPhone");
  const email=val("regEmail");
  const password=val("regPassword");
  const role=val("regRole");

  if(!name||!email||!password){
    showMsg("regMsg","Ad, e-posta ve şifre alanlarını doldurun.");
    return;
  }
  if(password.length<6){
    showMsg("regMsg","Şifre en az 6 karakter olmalıdır.");
    return;
  }

  btn.disabled=true;
  btn.textContent="Hesap oluşturuluyor...";

  try{
    const {error}=await db.auth.signUp({
      email,
      password,
      options:{
        data:{full_name:name,phone:phone,role:role},
        emailRedirectTo:"https://mastirgo.github.io/servis-partnerim/index-test.html"
      }
    });

    if(error)throw error;

    showMsg("regMsg","Hesap oluşturma isteği gönderildi.\nE-posta doğrulaması isteniyorsa gelen kutunuzu kontrol edin.\nDoğrulama tamamlandıktan sonra giriş yapın.");
  }catch(error){
    showMsg("regMsg","Kayıt hatası: "+error.message);
  }finally{
    btn.disabled=false;
    btn.textContent="Hesap Oluştur";
  }
}

async function login(){
  hide("authMsg");

  const btn=document.getElementById("loginBtn");
  const email=val("email");
  const password=val("password");

  if(!email||!password){
    showMsg("authMsg","E-posta ve şifre girin.");
    return;
  }

  btn.disabled=true;
  btn.textContent="Giriş yapılıyor...";

  try{
    // Önce eski yerel oturumu temizle
    await db.auth.signOut({scope:"local"});

    const {data,error}=await db.auth.signInWithPassword({email,password});
    if(error)throw error;
    if(!data.user)throw new Error("Kullanıcı bilgisi alınamadı.");

    currentUser=data.user;
    await loadProfile();

  }catch(error){
    showOnly("auth");
    showMsg("authMsg","Giriş hatası: "+error.message);
  }finally{
    btn.disabled=false;
    btn.textContent="Giriş Yap";
  }
}

async function loadProfile(){
  if(!currentUser){
    showOnly("auth");
    return;
  }

  const {data,error}=await db.from("profiles")
    .select("*")
    .eq("id",currentUser.id)
    .maybeSingle();

  if(error){
    showOnly("auth");
    showMsg("authMsg","Profil okunamadı: "+error.message);
    return;
  }

  if(!data){
    const role=currentUser.user_metadata?.role;

    if(!["company","driver","passenger"].includes(role)){
      showOnly("auth");
      showMsg("authMsg","Hesap rolü bulunamadı.");
      return;
    }

    showSetup(role);
    return;
  }

  currentProfile=data;
  await showPanel();
}

function showSetup(role){
  showOnly("onboarding");

  document.getElementById("setupTitle").textContent=roleName(role)+" Hesap Kurulumu";

  if(role==="company"){
    document.getElementById("setupFields").innerHTML=`
      <p>Firma hesabınızı oluşturun.</p>
      <button onclick="createCompany()">Firmamı Oluştur</button>
    `;
  }else{
    document.getElementById("setupFields").innerHTML=`
      <p>Katılmak istediğiniz firmanın kodunu ve güzergâhınızı girin.</p>
      <input id="joinCode" placeholder="Firma katılım kodu">
      <button onclick="findRoutes()">Güzergâhları Getir</button>
      <select id="joinRoute">
        <option value="">Önce firma kodunu girin</option>
      </select>
      <button id="joinBtn" onclick="joinCompany()">Firmaya Katıl</button>
    `;
  }
}

async function createCompany(){
  hide("setupMsg");

  try{
    const {data:userData,error:userError}=await db.auth.getUser();
    if(userError)throw userError;
    if(!userData.user)throw new Error("Oturum bulunamadı. Tekrar giriş yapın.");

    currentUser=userData.user;

    const {error}=await db.rpc("create_company",{
      p_company_name:currentUser.user_metadata.full_name,
      p_full_name:currentUser.user_metadata.full_name,
      p_phone:currentUser.user_metadata.phone||null
    });

    if(error)throw error;

    await loadProfile();
  }catch(error){
    showMsg("setupMsg","Firma oluşturulamadı: "+error.message);
  }
}

async function findRoutes(){
  hide("setupMsg");

  const code=val("joinCode");
  if(!code){
    showMsg("setupMsg","Firma kodunu girin.");
    return;
  }

  try{
    const {data,error}=await db.rpc("get_company_routes",{p_join_code:code});
    if(error)throw error;

    const select=document.getElementById("joinRoute");
    select.innerHTML='<option value="">Güzergâh seçin</option>';

    (data||[]).forEach(route=>{
      const option=document.createElement("option");
      option.value=route.route_id;
      option.textContent=route.route_name;
      select.appendChild(option);
    });

    if(!data||!data.length){
      showMsg("setupMsg","Bu firmaya ait güzergâh bulunamadı.");
    }else{
      showMsg("setupMsg",data.length+" güzergâh bulundu.");
    }
  }catch(error){
    showMsg("setupMsg","Güzergâhlar alınamadı: "+error.message);
  }
}

async function joinCompany(){
  hide("setupMsg");

  const btn=document.getElementById("joinBtn");
  const code=val("joinCode");
  const routeId=val("joinRoute");

  if(!code||!routeId){
    showMsg("setupMsg","Firma kodu ve güzergâh seçimi gereklidir.");
    return;
  }

  btn.disabled=true;
  btn.textContent="Oturum kontrol ediliyor...";

  try{
    // Oturumu ve kullanıcıyı sunucudan tekrar doğrula
    const {data:sessionData,error:sessionError}=await db.auth.getSession();
    if(sessionError)throw sessionError;

    if(!sessionData.session){
      throw new Error("Oturum bulunamadı. Çıkış yapıp yeniden giriş yapın.");
    }

    const {data:userData,error:userError}=await db.auth.getUser();
    if(userError)throw userError;

    const user=userData.user;
    if(!user){
      throw new Error("Supabase kullanıcıyı doğrulayamadı. Çıkış yapıp yeniden giriş yapın.");
    }

    if(user.id!==sessionData.session.user.id){
      throw new Error("Oturum kimliği uyuşmuyor. Çıkış yapıp yeniden giriş yapın.");
    }

    currentUser=user;

    const meta=user.user_metadata||{};
    const role=meta.role;

    if(!["driver","passenger"].includes(role)){
      throw new Error("Hesap rolü geçersiz.");
    }

    // Önceden profil oluşmuşsa tekrar katılım yapma
    const {data:existing,error:existingError}=await db
      .from("profiles")
      .select("*")
      .eq("id",user.id)
      .maybeSingle();

    if(existingError)throw existingError;

    if(existing){
      currentProfile=existing;
      await showPanel();
      return;
    }

    btn.textContent="Firmaya katılıyor...";

    const {error}=await db.rpc("join_company",{
      p_join_code:code,
      p_role:role,
      p_route_id:routeId,
      p_full_name:meta.full_name||user.email,
      p_phone:meta.phone||null,
      p_morning_enabled:true,
      p_evening_enabled:true
    });

    if(error){
      throw new Error("Katılım işlemi başarısız: "+error.message+
        " (Kod: "+(error.code||"bilinmiyor")+")");
    }

    await loadProfile();

  }catch(error){
    showMsg("setupMsg","Katılım başarısız: "+error.message);
  }finally{
    btn.disabled=false;
    btn.textContent="Firmaya Katıl";
  }
}

async function showPanel(){
  showOnly("panel");
  hide("companyPanel");
  hide("memberPanel");

  const p=currentProfile;

  document.getElementById("welcome").textContent="Merhaba, "+(p.full_name||"Kullanıcı");
  document.getElementById("profileInfo").textContent="Hesap türü: "+roleName(p.role);

  if(p.role==="company"){
    show("companyPanel");
    await loadCompany();
  }else{
    show("memberPanel");

    if(p.role==="passenger"){
      show("ridePreferenceCard");
    }else{
      hide("ridePreferenceCard");
    }

    await loadMember();
  }
}

async function loadCompany(){
  const {data:company,error}=await db.from("companies")
    .select("*")
    .eq("id",currentProfile.company_id)
    .maybeSingle();

  if(error){
    document.getElementById("companyInfo").textContent="Firma bilgisi okunamadı: "+error.message;
  }else if(company){
    document.getElementById("companyInfo").textContent=
      "Firma: "+(company.name||"")+" | Firma kodu: "+(company.join_code||"Henüz görüntülenemiyor");
  }

  const {data:routes,error:routeError}=await db.from("routes")
    .select("id,name,route_type")
    .eq("company_id",currentProfile.company_id);

  const box=document.getElementById("companyRoutes");
  box.innerHTML="";

  if(routeError){
    box.textContent="Güzergâhlar okunamadı: "+routeError.message;
    return;
  }

  if(!routes||!routes.length){
    box.textContent="Henüz güzergâh eklenmedi.";
    return;
  }

  routes.forEach(r=>{
    const div=document.createElement("div");
    div.className="item";
    div.textContent=(r.name||"İsimsiz güzergâh")+" — "+(r.route_type||"");
    box.appendChild(div);
  });
}

async function addRoute(){
  hide("routeMsg");
  const name=val("routeName");

  if(!name){
    showMsg("routeMsg","Güzergâh adı girin.");
    return;
  }

  try{
    const {error}=await db.from("routes").insert({
      company_id:currentProfile.company_id,
      name:name,
      route_type:val("routeType"),
      start_point:val("startPoint")||null,
      end_point:val("endPoint")||null,
      planned_km:val("plannedKm")?Number(val("plannedKm")):null
    });

    if(error)throw error;

    showMsg("routeMsg","Güzergâh eklendi.");
    ["routeName","startPoint","endPoint","plannedKm"].forEach(id=>{
      document.getElementById(id).value="";
    });
    await loadCompany();

  }catch(error){
    showMsg("routeMsg","Güzergâh eklenemedi: "+error.message);
  }
}

async function loadMember(){
  const p=currentProfile;

  let info="Ad Soyad: "+(p.full_name||"")+" | Rol: "+roleName(p.role);

  if(p.role==="driver"){
    info+=" | Şoför hesabı";
  }

  if(p.role==="passenger"){
    info+=" | Sabah: "+(p.morning_enabled?"Evet":"Hayır")+
      " | Akşam: "+(p.evening_enabled?"Evet":"Hayır");

    document.getElementById("morning").checked=!!p.morning_enabled;
    document.getElementById("evening").checked=!!p.evening_enabled;
  }

  document.getElementById("memberInfo").textContent=info;
}

async function saveRideStatus(){
  if(!currentProfile||currentProfile.role!=="passenger"){
    showMsg("rideMsg","Bu işlem yalnızca yolcu hesapları içindir.");
    return;
  }

  try{
    const {error}=await db.rpc("update_my_ride_status",{
      p_morning:document.getElementById("morning").checked,
      p_evening:document.getElementById("evening").checked
    });

    if(error)throw error;

    showMsg("rideMsg","Servis tercihleriniz kaydedildi.");
    await loadProfile();

  }catch(error){
    showMsg("rideMsg","Tercihler kaydedilemedi: "+error.message);
  }
}

async function start(){
  if(!initSupabase())return;

  try{
    const {data,error}=await db.auth.getSession();
    if(error)throw error;

    if(!data.session){
      showOnly("auth");
      return;
    }

    // Otomatik açılan eski oturumun sunucuda geçerli olup olmadığını denetle
    const {data:userData,error:userError}=await db.auth.getUser();

    if(userError||!userData.user){
      await db.auth.signOut({scope:"local"});
      currentUser=null;
      currentProfile=null;
      showOnly("auth");
      showMsg("authMsg","Eski oturum geçersizdi. Lütfen yeniden giriş yapın.");
      return;
    }

    currentUser=userData.user;
    await loadProfile();

  }catch(error){
    showOnly("auth");
    showMsg("authMsg","Başlatma hatası: "+error.message);
  }
}

start();
</script>
</body>
</html>
